<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="text-scale" content="scale">
<meta name="theme-color" content="#efefeb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spent">
<title>Spent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=6">
<link rel="icon" href="icon-512.png?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap">
<style>
/* One screen: Today's number, the words you say, the button under your thumb. The month waits behind a swipe up.
   Flat and quiet: one accent, and it always means "ahead of pace". Things move only when you act. */
:root {
  --bg: #efefeb; --ink: #161616; --soft: rgb(22 22 22 / .34); --dim: rgb(22 22 22 / .6); --line: rgb(22 22 22 / .12);
  --sheet: #f8f8f5; --field: #ffffff; --accent: #d33a2c; --on-ink: #efefeb;
  --ui: "IBM Plex Sans Arabic", -apple-system, system-ui, "Segoe UI", Tahoma, sans-serif;
  --out: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111111; --ink: #ecebe6; --soft: rgb(236 235 230 / .34); --dim: rgb(236 235 230 / .6); --line: rgb(236 235 230 / .13);
    --sheet: #1a1a1a; --field: #0b0b0b; --accent: #ff5e4e; --on-ink: #111111; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.num, .amt, .mrow .v, .msum b { font-variant-numeric: tabular-nums; }

/* ---------- the screen ---------- */
.screen { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; touch-action: none; user-select: none; -webkit-user-select: none;
  padding-top: calc(64px + env(safe-area-inset-top, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.top { display: grid; min-height: 0; }
.top > * { grid-area: 1 / 1; min-width: 0; }

/* Today */
.today { display: grid; align-content: center; justify-items: center; gap: 4px; text-align: center; transition: opacity .2s, translate .3s var(--out), scale .3s var(--out); }
.screen:not([data-phase="idle"]) .today { opacity: .15; translate: 0 -16vh; scale: .6; pointer-events: none; }
.numBtn { min-height: 112px; min-width: 200px; display: grid; place-items: center; }
.num { font-size: 96px; font-weight: 300; line-height: 1; letter-spacing: -.03em; direction: ltr; display: inline-flex; }
.num .col { display: inline-block; height: 1em; overflow: hidden; }
.num .strip { display: flex; flex-direction: column; transition: translate .4s var(--out); }
.num .strip span, .num > span { display: block; height: 1em; line-height: 1; }
.veil { display: none; width: 180px; height: 34px; border-radius: 17px; background: var(--line); }
.today[data-hidden] .num { display: none; }
.today[data-hidden] .veil { display: block; }
.today[data-over] .num, .today[data-over] .tlabel { color: var(--accent); }
.tlabel { font-size: 15px; color: var(--dim); }
.tmr { font-size: 14px; color: var(--dim); min-height: 21px; }

/* the words: what you're saying, then what was saved */
.stage { display: grid; align-content: center; justify-items: center; text-align: center; padding-top: 14vh; pointer-events: none; }
.stage > * { grid-area: 1 / 1; width: min(24rem, 100%); }
.fade { opacity: 0; visibility: hidden; transition: opacity .15s, visibility 0s linear .15s; }
.fade.on { opacity: 1; visibility: visible; transition: opacity .15s, visibility 0s; pointer-events: auto; }
.said { display: grid; gap: 14px; }
.said p { font-size: 28px; line-height: 1.35; font-weight: 500; overflow-wrap: anywhere; text-wrap: pretty; }
.said .vol { color: var(--soft); }
.wait { height: 1px; background: var(--ink); transform: scaleX(0); transform-origin: right; }
.screen[data-phase="thinking"] .wait { transform: scaleX(1); transition: transform 1.6s cubic-bezier(.4, 0, .2, 1); }
.typed input { width: 100%; min-block-size: 3rem; padding: .75rem 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--field); font-size: 1.0625rem; text-align: center; }
.typed input::placeholder { color: var(--soft); }

.slip { display: grid; justify-items: center; gap: 4px; touch-action: none; transition: opacity .2s, translate .35s var(--out), visibility 0s linear .35s; }
.slip.on { transition: opacity .2s, translate .35s var(--out), visibility 0s; }
.slip.drag { transition: none; }
.s1 { display: flex; align-items: baseline; justify-content: center; gap: 14px; flex-wrap: wrap; }
.cat { font-size: 22px; font-weight: 500; }
.amt { font-size: 48px; font-weight: 300; line-height: 1.1; letter-spacing: -.02em; }
.amt small { font-size: .4em; color: var(--dim); margin-inline-start: .25em; letter-spacing: 0; }
.s2 { font-size: 15px; color: var(--dim); max-width: 32ch; text-wrap: balance; }
.slip[data-attention] .s2 { color: var(--accent); }
.slip[data-chat] .s2 { font-size: 19px; line-height: 1.65; color: var(--ink); max-width: 30ch; } /* the adviser's answer */
.msum b.quiet { color: var(--dim); font-weight: 400; }
.undo { min-height: 44px; padding-inline: 12px; font-size: 14px; color: var(--dim); }

.ask { min-height: 24px; text-align: center; font-size: 15px; color: var(--dim); text-wrap: balance; transition: opacity .2s; }
.screen:not([data-phase="idle"]) .ask { opacity: 0; }
.ask[data-question] { color: var(--ink); }

/* the button */
.dock { display: grid; justify-items: center; padding-top: 18px; }
.orb { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--ink); transition: scale .12s var(--out), background-color .15s, color .15s; }
.orb svg { grid-area: 1 / 1; width: 28px; height: 28px; }
.orb .stop { display: none; width: 16px; height: 16px; }
.screen[data-phase="listening"] .orb { background: var(--ink); color: var(--on-ink); scale: .96; }
.screen[data-phase="listening"] .orb .mic { display: none; }
.screen[data-phase="listening"] .orb .stop { display: block; }
.orb:active { scale: .94; }
.orb[aria-disabled="true"] { cursor: progress; opacity: .5; }
.pull { width: 72px; height: 32px; display: grid; place-items: center; margin-top: 6px; }
.pull::before { content: ""; width: 32px; height: 3px; border-radius: 2px; background: var(--ink); opacity: .25; }

/* corners */
.corner { position: fixed; z-index: 5; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; }
.corner.l { left: max(10px, env(safe-area-inset-left, 0px)); }
.corner.r { right: max(10px, env(safe-area-inset-right, 0px)); }
.icon { min-width: 44px; min-height: 44px; padding: 0 .5rem; border-radius: 999px; display: grid; place-items: center; color: var(--dim); font-size: .875rem; }
.icon svg { width: 20px; height: 20px; }
.pending { color: var(--accent); }

/* ---------- the Month View: only when asked for ---------- */
.month { position: fixed; z-index: 8; inset: 0; top: calc(48px + env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); border-radius: 20px 20px 0 0; box-shadow: 0 0 0 1px var(--line);
  padding-block: 4px calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  translate: 0 105%; visibility: hidden; transition: translate .38s var(--out), visibility 0s linear .38s; }
.month.open { translate: none; visibility: visible; transition: translate .38s var(--out), visibility 0s; }
.month-in { width: min(30rem, 100%); margin-inline: auto; display: grid; }
.grab { justify-self: center; width: 72px; height: 32px; display: grid; place-items: center; }
.grab::before { content: ""; width: 32px; height: 3px; border-radius: 2px; background: var(--ink); opacity: .25; }
.mhead { display: flex; justify-content: space-between; align-items: baseline; padding-block: 8px 12px; }
.mhead h2 { margin: 0; font-size: 22px; font-weight: 500; }
.mhead span { font-size: 14px; color: var(--dim); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; padding-block: 14px; border-top: 1px solid var(--line); }
.mrow .n { font-size: 16px; }
.mrow .v { font-size: 16px; }
.mrow .v.quiet { color: var(--dim); }
.mrow[data-attention] .v { color: var(--accent); }
.bar { grid-column: 1 / -1; position: relative; height: 2px; background: var(--line); }
.bar i { position: absolute; inset-block: 0; right: 0; background: var(--ink); }
.mrow[data-attention] .bar i { background: var(--accent); }
.bar b { position: absolute; top: -4px; width: 1px; height: 10px; background: var(--ink); }
.msum { display: grid; gap: 8px; padding-top: 16px; border-top: 1px solid var(--ink); }
.msum p { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.msum span { font-size: 15px; color: var(--dim); }
.msum b { font-size: 17px; font-weight: 500; }
.msum p[data-attention] b { color: var(--accent); }
.mempty { padding-block: 24px; color: var(--dim); font-size: 15px; }
.mlinks { display: flex; gap: 20px; padding-top: 20px; font-size: 14px; }
.mlinks a, .mlinks button { color: var(--dim); min-height: 44px; display: inline-grid; place-items: center; text-decoration: none; }

/* ---------- setup: a native modal that slides up from the bottom ---------- */
.sheet { margin: auto auto 0; width: min(100%, 36rem); max-width: 100%; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); color: var(--ink); border: 0; border-radius: 20px 20px 0 0; box-shadow: 0 0 0 1px var(--line);
  padding-block: 1.25rem calc(1.375rem + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  opacity: 0; transition-property: opacity, translate, display, overlay; transition-duration: .35s; transition-timing-function: var(--out);
  transition-behavior: allow-discrete;
  @media (prefers-reduced-motion: no-preference) { translate: 0 100%; }
  @media (prefers-reduced-motion: reduce) { transition-duration: .12s; } }
.sheet[open] { display: grid; gap: 1rem; }
:is(.sheet[open]):where(:not([data-closing])) { opacity: 1; translate: none;
  @starting-style { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) { @starting-style { translate: 0 100%; } } }
.sheet::backdrop { background: rgb(0 0 0 / 0); overflow: hidden; overscroll-behavior: contain;
  transition-property: background-color, display, overlay; transition-duration: .35s; transition-behavior: allow-discrete; }
:is(.sheet[open]):where(:not([data-closing]))::backdrop { background: rgb(0 0 0 / .35);
  @starting-style { background: rgb(0 0 0 / 0); } }
.sheet .grab { margin-top: -.75rem; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.sheet h2 { margin: 0; font-weight: 500; font-size: 1.25rem; }
.sheet p, .sheet small { font-size: .875rem; color: var(--dim); line-height: 1.6; }
.step { display: grid; gap: .5rem; padding: .875rem; border-radius: 14px; border: 1px solid var(--line); }
.step[data-done] { border-color: var(--ink); }
.step h3 { margin: 0; font-size: 1rem; font-weight: 500; display: flex; gap: .5rem; align-items: center; }
.sheet input, .sheet select { width: 100%; min-block-size: 2.75rem; padding: .625rem .75rem; border-radius: 10px; border: 1px solid var(--line); background: var(--field); }
.sheet input[type="password"], .sheet select { direction: ltr; text-align: left; }
.btn, .ghost { min-block-size: 2.75rem; border-radius: 10px; padding: .625rem 1.125rem; cursor: pointer; text-align: center; text-decoration: none; display: inline-grid; place-items: center; }
.btn { background: var(--ink); color: var(--on-ink); font-weight: 500; }
.btn:active { opacity: .85; }
.ghost { border: 1px solid var(--line); color: var(--ink); }
.row { display: flex; gap: .5rem; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { .today, .num .strip, .slip, .month, .orb, .wait { transition-duration: .01s !important; } }
@media (forced-colors: active) { .orb, .icon, .step, .sheet, .month, .typed input { border: 2px solid ButtonText; } }
</style>
</head>
<body>
<main class="screen" id="screen" data-phase="idle">
  <div class="top">
    <div class="today" id="today">
      <button class="numBtn" id="numBtn" type="button" aria-pressed="false"><bdi class="num" id="num"></bdi><span class="veil" aria-hidden="true"></span></button>
      <p class="tlabel" id="tlabel"></p>
      <p class="tmr" id="tmr"></p>
    </div>
    <div class="stage">
      <div class="said fade" id="said"><p><span id="fin"></span><span class="vol" id="vol"></span></p><div class="wait" aria-hidden="true"></div></div>
      <form class="typed fade" id="typedForm"><input id="typed" autocomplete="off" enterkeyhint="send" lang="ar" dir="rtl" placeholder="اكتب أو اضغط 🎤 في الكيبورد" aria-label="الصرفة"></form>
      <div class="slip fade" id="slip">
        <p class="s1" id="s1"><span class="cat" id="cat"></span><bdi class="amt" id="amt"></bdi></p>
        <p class="s2" id="s2"></p>
        <button class="undo" id="undo" type="button">تراجع</button>
      </div>
    </div>
  </div>
  <p class="ask" id="ask"></p>
  <div class="dock">
    <button class="orb" id="orb" type="button" aria-label="اضغط واتكلم">
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      <svg class="stop" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="currentColor"/></svg>
    </button>
    <button class="pull" id="pull" type="button" aria-label="الشهر"></button>
  </div>
</main>

<!-- one polite and one urgent announcer, so screen readers hear the Brief once and not every interim word -->
<p class="sr-only" id="say" aria-live="polite" aria-atomic="true"></p>
<p class="sr-only" id="shout" role="alert" aria-atomic="true"></p>

<div class="corner l"><button class="icon" id="gear" type="button" aria-label="الإعدادات">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
</button></div>
<div class="corner r"><button class="icon pending" id="pending" type="button" hidden></button></div>

<section class="month" id="month" aria-labelledby="monthTitle" aria-hidden="true">
  <div class="month-in">
    <button class="grab" id="grab" type="button" aria-label="اقفل"></button>
    <div class="mhead"><h2 id="monthTitle"></h2><span id="mday"></span></div>
    <div id="rows"></div>
    <div class="msum" id="msum"></div>
    <div class="mlinks"><a id="monthSheet" target="_blank" rel="noopener" hidden>افتح الشيت</a></div>
  </div>
</section>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle" closedby="any">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Spent</h2>
    <button class="icon" id="closeSheet" type="button" aria-label="اقفل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="step" id="stepClaude">
    <h3 id="claudeTitle">1. مفتاح Claude <span id="claudeDone" hidden>✓<span class="sr-only"> جاهز</span></span></h3>
    <small id="claudeHelp">من console.anthropic.com. لو اشتراكك Max أو Ultra، فيه رصيد API من الاشتراك. المفتاح بيفضل على الموبايل ده بس.</small>
    <input id="key" type="password" autofocus autocomplete="off" placeholder="sk-ant-…" aria-labelledby="claudeTitle" aria-describedby="claudeHelp">
    <select id="model" aria-label="موديل Claude">
      <option value="claude-haiku-5-5">Claude Haiku 5.5 · أسرع وأرخص</option>
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
      <option value="claude-opus-5-5">Claude Opus 5.5 · أدق</option>
    </select>
  </div>
  <div class="step" id="stepGoogle">
    <h3 id="googleTitle">2. شيت جوجل <span id="googleDone" hidden>✓<span class="sr-only"> متوصّل</span></span></h3>
    <small>Spent بيعمل شيت في الدرايف بتاعك ويكتب فيه. مابيشوفش أي ملف تاني.</small>
    <div class="row">
      <button class="btn" id="connect" type="button">اربط جوجل</button>
      <a class="ghost" id="openSheet" target="_blank" rel="noopener" hidden>افتح الشيت</a>
    </div>
    <small id="googleMsg" role="status"></small>
  </div>
  <div class="row"><button class="btn" id="save" type="button">تمام</button></div>
</dialog>

<script type="module" src="app.js?v=7"></script>
</body>
</html>
